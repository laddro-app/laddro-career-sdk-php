name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - run: composer install --no-interaction
      - run: php -r "require 'vendor/autoload.php'; \$c = new Laddro\Career\Laddro('test'); echo 'OK';"
